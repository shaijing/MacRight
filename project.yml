name: MacRight
options:
  bundleIdPrefix: com.macright
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MacRight:
    type: application
    platform: macOS
    sources:
      - path: MacRight
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "MacRight.entitlements"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: MacRight/Info.plist
      properties:
        CFBundleDisplayName: MacRight
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    entitlements:
      path: MacRight/MacRight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.com.macright.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macright.app
        PRODUCT_NAME: MacRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    dependencies:
      - target: FinderSyncExtension

  FinderSyncExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSyncExtension
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "FinderSyncExtension.entitlements"
          - Resources/Templates
      - path: Shared
        excludes:
          - "**/.DS_Store"
    resources:
      - path: FinderSyncExtension/Resources/Templates
        buildPhase: resources
    info:
      path: FinderSyncExtension/Info.plist
      properties:
        CFBundleDisplayName: MacRight Finder Extension
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: FinderSyncExtension.FinderSync
    entitlements:
      path: FinderSyncExtension/FinderSyncExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.home-relative-path.read-write:
          - /
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.volumes.removable.read-write: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - /Volumes/
        com.apple.security.application-groups:
          - group.com.macright.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macright.app.FinderSyncExtension
        PRODUCT_NAME: FinderSyncExtension
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: YES
